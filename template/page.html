<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>内容页母版 · 210 × 285 mm</title>
<style>
  /* ==========================================================
     页面基础：成品尺寸 210 × 285 mm，无页边距，颜色全部使用
     device-cmyk 定义，确保印刷输出色彩正确。
     ========================================================== */
  @page {
    size: 210mm 285mm;
    margin: 0;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: device-cmyk(0 0 0 0);
  }

  /* ----------------------------------------------------------
     页面容器：只定义几何与印刷属性，不带任何字体 / 字号 /
     行距 / 颜色规则，避免级联干预之后的正文排版。
     ---------------------------------------------------------- */
  .page {
    position: relative;
    width: 210mm;
    height: 285mm;
    box-sizing: border-box;
    overflow: hidden;
    background: device-cmyk(0 0 0 0);
    break-after: page;
    page-break-after: always;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ==========================================================
     页眉：栏目名靠外，期号靠内，下方一条极细线
     ========================================================== */
  .page-header {
    position: absolute;
    top: 13mm;
    left: 20mm;
    right: 20mm;
    height: 6mm;
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    font-size: 7.5pt;
    line-height: 6mm;
    letter-spacing: 0.12em;
    color: device-cmyk(0 0 0 0.72);
  }

  .header-section,
  .header-issue {
    position: absolute;
    top: 0;
  }

  .header-rule {
    position: absolute;
    top: 20mm;
    left: 20mm;
    right: 20mm;
    height: 0.2mm;
    background: device-cmyk(0 0 0 1);
  }

  /* ==========================================================
     版心：只锚定正文可用区域，内部不做任何样式预设
     ========================================================== */
  .page-body {
    position: absolute;
    top: 26mm;
    left: 20mm;
    right: 20mm;
    bottom: 24mm;
    overflow: hidden;
  }

  /* ==========================================================
     页脚：上方一条极细线，页码靠外，名言靠内
     ========================================================== */
  .footer-rule {
    position: absolute;
    bottom: 19mm;
    left: 20mm;
    right: 20mm;
    height: 0.2mm;
    background: device-cmyk(0 0 0 1);
  }

  .page-footer {
    position: absolute;
    bottom: 12mm;
    left: 20mm;
    right: 20mm;
    height: 6mm;
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    font-size: 7.5pt;
    line-height: 6mm;
    letter-spacing: 0.12em;
    color: device-cmyk(0 0 0 0.72);
  }

  .footer-page,
  .footer-quote {
    position: absolute;
    top: 0;
  }

  /* ---------------- 奇数页（右页）：外 = 右，内 = 左 ---------------- */
  .page--odd .header-section { right: 0; }
  .page--odd .header-issue   { left: 0; }
  .page--odd .footer-page    { right: 0; }
  .page--odd .footer-quote   { left: 0; }

  /* ---------------- 偶数页（左页）：外 = 左，内 = 右 ---------------- */
  .page--even .header-section { left: 0; }
  .page--even .header-issue   { right: 0; }
  .page--even .footer-page    { left: 0; }
  .page--even .footer-quote   { right: 0; }
</style>
</head>

<body>

  <!--
    ==========================================================
    内容页母版（奇数页 / 右页示例）
    使用方式：
      · 右页：<div class="page page--odd"> … </div>
      · 左页：<div class="page page--even"> … </div>
    修改项：
      · .header-section  栏目名（靠外）
      · .header-issue    期号（靠内）
      · .footer-page     页码（靠外）
      · .footer-quote    名言（靠内）
    版心（.page-body）内不设任何预设样式，
    字体、字号、行距、缩进等均由具体页面自行决定。
    ==========================================================
  -->
  <div class="page page--odd">

    <!-- 页眉 -->
    <div class="page-header">
      <span class="header-section">栏目名称</span>
      <span class="header-issue">2611</span>
    </div>
    <div class="header-rule"></div>

    <!-- 正文：内容由具体页面自行排版，此处不做任何预设 -->
    <div class="page-body"></div>

    <!-- 页脚 -->
    <div class="footer-rule"></div>
    <div class="page-footer">
      <span class="footer-page">012</span>
      <span class="footer-quote">图难于其易，为大于其细</span>
    </div>

  </div>

</body>
</html>
