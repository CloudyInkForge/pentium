<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封底</title>
<style>
  @page {
    size: 210mm 285mm;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 210mm;
    height: 285mm;
    background-color: #F7F6F2;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 285mm;
    overflow: hidden;
    background-color: #F7F6F2;

    /* 与封面共用同一套尺寸变量 */
    --side: 10.5mm;
    --img-top: 28mm;
    --img-bottom: 77mm;

    /* 主色与层级灰阶 */
    --ink: #2E3A2E;
    --ink-60: rgba(46, 58, 46, 0.60);
    --ink-35: rgba(46, 58, 46, 0.35);
    --ink-25: rgba(46, 58, 46, 0.25);

    --serif: "Times New Roman", Times, Georgia, "Songti SC", serif;
    --sans: "Helvetica Neue", Helvetica, Arial,
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  /* ============================================================
     1. 顶部刊名条 —— 细线 + MAGAZINE，与封面镜像
     ============================================================ */
  .masthead {
    position: absolute;
    top: 10mm;
    left: var(--side);
    right: var(--side);
    display: flex;
    align-items: center;
    gap: 7mm;
    z-index: 3;
  }

  .masthead-rule {
    flex: 1;
    height: 0.25mm;
    background-color: var(--ink);
    opacity: 0.22;
  }

  .magazine-mark {
    font-family: var(--serif);
    font-size: 6.5mm;
    font-weight: 400;
    letter-spacing: 1.4mm;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
    margin-right: -1.4mm; /* 抵消末字母字距，使右缘严格对齐 */
  }

  /* ============================================================
     2. 主图容器 —— template/bc.png
     ============================================================ */
  .image-container {
    position: absolute;
    top: var(--img-top);
    left: var(--side);
    right: var(--side);
    bottom: var(--img-bottom);

    overflow: hidden;
    background-color: #F7F6F2;

    background-image: url('bc.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;

    z-index: 1;
  }

  /* ============================================================
     3. 刊号信息栏 —— SINCE 居左、刊号居右
     ============================================================ */
  .issue-bar {
    position: absolute;
    top: 218mm;
    left: var(--side);
    right: var(--side);
    height: 12mm;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    color: var(--ink);
    z-index: 2;
  }

  /* — 左：SINCE 2024 — */
  .since-mark {
    display: flex;
    align-items: baseline;
    gap: 1.6mm;
    font-family: var(--sans);
  }

  .since-label {
    font-size: 2.7mm;
    font-weight: 700;
    letter-spacing: 0.75mm;
    color: var(--ink);
    opacity: 0.55;
  }

  .since-year {
    font-family: var(--serif);
    font-size: 4.2mm;
    font-weight: 400;
    letter-spacing: 0.2mm;
    line-height: 1;
    color: var(--ink);
  }

  /* — 右：2026 | 11  VOL. 3 — */
  .issue-right {
    display: flex;
    align-items: baseline;
  }

  .issue-date {
    font-family: var(--serif);
    font-size: 10mm;
    font-weight: 400;
    letter-spacing: 0.2mm;
    line-height: 1;
    color: var(--ink);
  }

  .issue-sep {
    display: block;
    width: 0.25mm;
    height: 6mm;
    margin: 0 3mm;
    background-color: var(--ink);
    opacity: 0.3;
    align-self: center;
    transform: translateY(-0.4mm);
  }

  .issue-vol {
    font-family: var(--sans);
    font-size: 3.2mm;
    font-weight: 700;
    letter-spacing: 1mm;
    color: var(--ink);
    opacity: 0.68;
    margin-left: 3.2mm;
  }

  /* ============================================================
     4. 版权信息
     ============================================================ */
  .colophon {
    position: absolute;
    left: var(--side);
    right: var(--side);
    bottom: 15mm;
    font-family: var(--sans);
    color: var(--ink);
    line-height: 1.6;
  }

  .colophon-rule {
    width: 9mm;
    height: 0.25mm;
    background-color: var(--ink);
    opacity: 0.35;
    margin-bottom: 3.4mm;
  }

  .colophon-brand {
    display: flex;
    align-items: baseline;
    gap: 3mm;
  }

  .brand-cn {
    font-size: 4.2mm;
    font-weight: 700;
    letter-spacing: 0.5mm;
    line-height: 1;
  }

  .brand-en {
    font-size: 2.5mm;
    font-weight: 400;
    letter-spacing: 0.9mm;
    opacity: 0.55;
    line-height: 1;
  }

  .colophon-copy {
    font-size: 2.8mm;
    letter-spacing: 0.3mm;
    opacity: 0.5;
    margin-top: 1.6mm;
  }
</style>
</head>
<body>
  <div class="page">

    <!-- 1. 顶部刊名条：细线 + MAGAZINE（与封面镜像） -->
    <div class="masthead">
      <span class="masthead-rule"></span>
      <span class="magazine-mark">MAGAZINE</span>
    </div>

    <!-- 2. 主图 template/bc.png -->
    <div class="image-container" role="img" aria-label="背封主图"></div>

    <!-- 3. 刊号信息栏 -->
    <div class="issue-bar">
      <div class="since-mark">
        <span class="since-label">SINCE</span>
        <span class="since-year">2024</span>
      </div>
      <div class="issue-right">
        <span class="issue-date">2026</span>
        <span class="issue-sep"></span>
        <span class="issue-date">11</span>
        <span class="issue-vol">VOL. 2</span>
      </div>
    </div>

    <!-- 4. 版权信息 -->
    <div class="colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-brand">
        <span class="brand-cn">《奔藤》</span>
        <span class="brand-en">BENGTENG MAGAZINE</span>
      </div>
      <div class="colophon-copy">© 2026 奔藤编辑部　保留所有权利</div>
    </div>

  </div>
</body>
</html>
