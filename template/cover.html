<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面</title>
<style>
  @page {
    size: 210mm 285mm;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 210mm;
    height: 285mm;
    background-color: #F7F6F2;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 285mm;
    overflow: hidden;
    background-color: #F7F6F2;

    /* 统一尺寸变量，全部用毫米，PDF 引擎计算最稳 */
    --side: 10.5mm;        /* 左右边距 5% ≈ 10.5mm */
    --img-top: 100mm;      /* 图片顶边：和原来 35%≈99.75mm 基本一致，不往下移 */
    --img-bottom: 5mm;     /* 下间距：由 14.25mm 减到 5mm，图片因此加高 */
  }

  /* ============================================================
     1. 左上角 MAGAZINE 装饰
     ============================================================ */
  .magazine-mark {
    position: absolute;
    top: 10mm;
    left: var(--side);
    font-family: "Times New Roman", Times, serif;
    font-size: 10mm;
    font-weight: bold;
    line-height: 1;
    letter-spacing: 1px;
    color: #2E3A2E;
  }

  /* ============================================================
     2. 标题 BT.PNG
     ============================================================ */
  .title-wrap {
    position: absolute;
    top: 28mm;
    left: 31.5mm;      /* 15% of 210mm */
    width: 147mm;      /* 70% of 210mm */
    height: 46mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ============================================================
     3. 刊号信息栏
     —— 位置从 102mm 上移到 86mm，整体位于图片上方，不再压进图片
     —— 高度 12mm，底部 98mm，与图片顶边 100mm 留 2mm 呼吸空间
     ============================================================ */
  .issue-bar {
    position: absolute;
    top: 86mm;
    left: var(--side);
    right: var(--side);
    height: 12mm;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #2E3A2E;
    z-index: 2;            /* 保险：即使引擎忽略位置，文字也始终在图片上层 */
  }

  .issue-left {
    display: flex;
    align-items: baseline;
  }

  .issue-date {
    font-size: 9mm;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .issue-sep {
    font-size: 8mm;
    margin: 0 3mm;
    font-weight: 300;
  }

  .issue-vol {
    font-size: 5mm;
    font-weight: bold;
    margin-left: 2mm;
  }

  .since-mark {
    font-size: 4.2mm;
    font-weight: bold;
    letter-spacing: 0.8mm;
    white-space: nowrap;
  }

  /* ============================================================
     4. 图片容器（核心修改）
     —— 全部用固定 mm 定位，避免 PDF 引擎对百分比四边约束计算偏差
     —— 高度 = 285 - 100 - 5 = 180mm，比原来的约 171mm 更高
     —— 图片改用 background-size: cover，兼容 PDF 引擎，不再依赖 object-fit
     ============================================================ */
  .image-container {
    position: absolute;
    top: var(--img-top);       /* 100mm，与原 35% 基本持平，不整体下移 */
    left: var(--side);         /* 10.5mm */
    right: var(--side);        /* 10.5mm，宽 189mm */
    bottom: var(--img-bottom); /* 5mm，下间距缩小，图片自然加高 */

    overflow: hidden;
    background-color: #F7F6F2;

    /* PDF 友好的图片铺满方式 */
    background-image: url('cz2.jpg');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;

    /* 强制打印/导出 PDF 时保留背景图颜色与图像 */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;

    z-index: 1;
  }
</style>
</head>
<body>
  <div class="page">

    <!-- 1. 左上角 MAGAZINE 装饰 -->
    <div class="magazine-mark">MAGAZINE</div>

    <!-- 2. 标题（BT.PNG） -->
    <div class="title-wrap">
      <img src="BT.PNG" alt="奔藤">
    </div>

    <!-- 3. 刊号信息栏 + SINCE 2024（已上移至图片上方，不再重叠） -->
    <div class="issue-bar">
      <div class="issue-left">
        <span class="issue-date">2026</span>
        <span class="issue-sep">|</span>
        <span class="issue-date">11</span>
        <span class="issue-vol">Vol. 3</span>
      </div>
      <div class="since-mark">SINCE 2024</div>
    </div>

    <!-- 4. 背景图严格容器（背景图铺满，PDF 转换更稳） -->
    <div class="image-container" role="img" aria-label="校园风景"></div>

  </div>
</body>
</html>
