<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>奔藤模板 T0 · 栏目扉页</title>
<style>
  /* ============================================================
     T0 · 栏目扉页 —— 整页藤绿出血，栏目编号大字 + 栏目名 + 导语
     适用：每个栏目起首一页。建议放在奇数页（右页）起头。
     ------------------------------------------------------------
     使用要点：
     1. 改四处字：编号数字、栏目名、导语、底部期号页码。
     2. .t0-accent 是本栏目的暖强调色小方块，按下方色表替换。
     3. 页码按"封面 = 第 1 页"连续累计；本模板示例为 05。
     4. 装配期目录时，把 fonts/ 目录一并复制过去或改相对路径。
     ============================================================ */

  @page {
    size: 210mm 285mm;
    margin: 0;
  }

  /* 字体：Noto Sans SC（思源黑体），OFL 开源，woff2 本地嵌入。
     中文与拉丁分文件，unicode-range 分流，避免回退异常。 */
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 400;
    src: url("fonts/noto-sans-sc/noto-sans-sc-chinese-simplified-400-normal.woff2") format("woff2");
    unicode-range: U+3000-9FFF, U+FF00-FFEF;
  }
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 400;
    src: url("fonts/noto-sans-sc/noto-sans-sc-latin-400-normal.woff2") format("woff2");
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F;
  }
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 500;
    src: url("fonts/noto-sans-sc/noto-sans-sc-chinese-simplified-500-normal.woff2") format("woff2");
    unicode-range: U+3000-9FFF, U+FF00-FFEF;
  }
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 500;
    src: url("fonts/noto-sans-sc/noto-sans-sc-latin-500-normal.woff2") format("woff2");
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F;
  }
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 700;
    src: url("fonts/noto-sans-sc/noto-sans-sc-chinese-simplified-700-normal.woff2") format("woff2");
    unicode-range: U+3000-9FFF, U+FF00-FFEF;
  }
  @font-face {
    font-family: "Noto Sans SC";
    font-weight: 700;
    src: url("fonts/noto-sans-sc/noto-sans-sc-latin-700-normal.woff2") format("woff2");
    unicode-range: U+0020-007E, U+00A0-00FF, U+2000-206F;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: device-cmyk(0 0 0 0);
  }

  .page {
    position: relative;
    width: 210mm;
    height: 285mm;
    box-sizing: border-box;
    overflow: hidden;
    break-after: page;
    page-break-after: always;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: device-cmyk(0.21 0 0.21 0.77); /* 藤绿主色，整页出血 */
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  .page:last-child { break-after: auto; page-break-after: auto; }

  /* 栏目编号大字：同色系提亮，做低调的底纹式大字 */
  .t0-num {
    position: absolute;
    top: 58mm;
    left: 16mm;
    font-size: 92pt;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.02em;
    color: device-cmyk(0.11 0 0.11 0.56);
  }

  /* 本栏目暖强调色小方块：全页唯一的彩色点 */
  .t0-accent {
    position: absolute;
    top: 16mm;
    left: 16mm;
    width: 6mm;
    height: 6mm;
    background: device-cmyk(0.05 0.88 0.82 0.05); /* 封面故事 · 朱红 */
  }

  .t0-name {
    position: absolute;
    top: 128mm;
    left: 16mm;
    font-size: 40pt;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.1em;
    color: device-cmyk(0 0 0 0);
  }

  .t0-rule {
    position: absolute;
    top: 158mm;
    left: 16mm;
    width: 14mm;
    height: 0.5mm;
    background: device-cmyk(0 0 0 0);
  }

  .t0-intro {
    position: absolute;
    top: 170mm;
    left: 16mm;
    width: 118mm;
    font-size: 9.5pt;
    font-weight: 400;
    line-height: 1.9;
    text-align: justify;
    color: device-cmyk(0.07 0 0.07 0.34);
  }

  /* 底部信息：极简一行，内/外依页序摆放 */
  .t0-foot-issue,
  .t0-foot-page {
    position: absolute;
    bottom: 12mm;
    font-size: 7.5pt;
    letter-spacing: 0.14em;
    color: device-cmyk(0.07 0 0.07 0.34);
  }
  .page--odd  .t0-foot-issue { left: 16mm; }
  .page--odd  .t0-foot-page  { right: 12mm; }
  .page--even .t0-foot-issue { right: 16mm; }
  .page--even .t0-foot-page  { left: 12mm; }

  /* ------------------------------------------------------------
     栏目暖强调色色表（device-cmyk，白字可读档）：
       封面故事  朱红   device-cmyk(0.05 0.88 0.82 0.05)
       时政摘编  赭红   device-cmyk(0.20 0.85 0.88 0.12)
       文史杂谈  砖棕   device-cmyk(0.25 0.72 0.88 0.22)
       正当年华  橘     device-cmyk(0    0.62 0.85 0)
       社会热点  金棕   device-cmyk(0.18 0.52 0.88 0.10)
       艺体观察  绛红   device-cmyk(0.12 0.92 0.72 0.15)
       校园天地  珊瑚棕 device-cmyk(0.08 0.58 0.68 0.12)
     对应浅底（用于 T1/T2 编者按等）约为各值乘 0.12。
     ------------------------------------------------------------ */
</style>
</head>
<body>

  <!--
    T0 栏目扉页示例：封面故事（奇数页 / 右页）
    装配时若落在偶数页，class 改为 page--even 即可（底部信息左右互换）。
  -->
  <div class="page page--odd">

    <div class="t0-accent"></div>

    <div class="t0-num">01</div>

    <div class="t0-name">封面故事</div>

    <div class="t0-rule"></div>

    <div class="t0-intro">
      九十年前，一支队伍从于都河出发，把信仰走成了山河。本辑收录七篇文字，
      从将帅的抉择到普通士兵的脚步，重回长征路上的九十昼夜。
    </div>

    <div class="t0-foot-issue">奔藤 · 2611 · 11</div>
    <div class="t0-foot-page">05</div>

  </div>

</body>
</html>
