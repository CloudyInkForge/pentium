# queries_2611.toml — 2611 期（2026 年 11 月，奔藤）插图检索清单
#
# 每篇条目：
#   no     文章序号（同 articles/contents.txt）
#   title  文章题目（phototags.txt 的“所属文章”，需与 contents.txt 一致）
#   file   照片文件名基名（首图 <file>.jpg，次图 <file>02.jpg…）
#   count  计划图数（提示值，非强制）
#   note   选图方向说明
#   queries 检索词列表，按优先级排序；source 取 fetch_images.py SOURCES 键
#
# 本期背景：封面故事为“纪念长征胜利九十周年”；本机网络无法直连
# Wikimedia Commons / LOC / AIC / Openverse，检索时会自动跳过，
# 故中国近现代历史照片类需求改用博物馆山水画、书法、器物等意象替代。

