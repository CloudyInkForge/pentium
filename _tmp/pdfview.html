<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pdf view</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  body { margin: 0; background: #555; }
  #pages { display: block; }
  canvas { display: block; margin: 8px auto; box-shadow: 0 0 6px #000; }
</style>
</head>
<body>
<div id="pages"></div>
<script>
const url = new URLSearchParams(location.search).get('pdf') || '../2611/2611.pdf';
const scale = parseFloat(new URLSearchParams(location.search).get('scale') || '2.0');
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async () => {
  const doc = await pdfjsLib.getDocument(url).promise;
  const n = doc.numPages;
  document.title = 'loaded ' + n;
  for (let i = 1; i <= n; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.id = 'pg' + i;
    canvas.width = vp.width; canvas.height = vp.height;
    document.getElementById('pages').appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  }
  document.title = 'done ' + n;
})();
</script>
</body>
</html>
